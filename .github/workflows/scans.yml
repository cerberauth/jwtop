name: Scans

on:
  push:
    branches:
      - main

env:
  GO_VERSION: "1.27"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build jwtop
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        run: go build -o jwtop main.go

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: jwtop
          path: jwtop
          retention-days: 1

  run-exploit-cli:
    name: Exploit CLI
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: jwtop

      - name: Prepare binary
        run: chmod +x jwtop

      - name: Create test token
        id: create
        run: echo "jwt=$(./jwtop create --alg HS256 --secret testsecret --sqa-opt-out)" >> $GITHUB_OUTPUT

      - name: Exploit algnone
        run: ./jwtop exploit algnone ${{ steps.create.outputs.jwt }} --sqa-opt-out

      - name: Exploit algnone --all
        run: ./jwtop exploit algnone --all ${{ steps.create.outputs.jwt }} --sqa-opt-out

      - name: Exploit blanksecret
        run: ./jwtop exploit blanksecret ${{ steps.create.outputs.jwt }} --sqa-opt-out

      - name: Exploit nullsig
        run: ./jwtop exploit nullsig ${{ steps.create.outputs.jwt }} --sqa-opt-out

      - name: Exploit weak / known secret
        run: ./jwtop exploit weaksecret --secret testsecret ${{ steps.create.outputs.jwt }} --sqa-opt-out

      - name: Exploit jwkinjection
        run: ./jwtop exploit jwkinjection ${{ steps.create.outputs.jwt }} --sqa-opt-out

      - name: Exploit jkuinjection
        run: ./jwtop exploit jkuinjection ${{ steps.create.outputs.jwt }} --url http://localhost:8089/jwks.json --sqa-opt-out

      - name: Exploit x5cinjection
        run: ./jwtop exploit x5cinjection ${{ steps.create.outputs.jwt }} --sqa-opt-out

      - name: Exploit x5uinjection
        run: ./jwtop exploit x5uinjection ${{ steps.create.outputs.jwt }} --url http://localhost:8090/cert.pem --sqa-opt-out

      - name: Generate RSA key pair
        run: |
          openssl genrsa -out private_key.pem 2048
          openssl rsa -in private_key.pem -pubout -out public_key.pem

      - name: Create RS256 test token
        id: create-rsa
        run: echo "jwt=$(./jwtop create --alg RS256 --key private_key.pem --sqa-opt-out)" >> $GITHUB_OUTPUT

      - name: Exploit hmacconfusion
        run: ./jwtop exploit hmacconfusion ${{ steps.create-rsa.outputs.jwt }} --key public_key.pem --sqa-opt-out

      - name: Generate EC key pair
        run: |
          openssl ecparam -name prime256v1 -genkey -noout -out ec_private_key.pem
          openssl ec -in ec_private_key.pem -pubout -out ec_public_key.pem

      - name: Create ES256 test token
        id: create-es256
        run: echo "jwt=$(./jwtop create --alg ES256 --key ec_private_key.pem --sqa-opt-out)" >> $GITHUB_OUTPUT

      - name: Exploit psychicsig
        run: ./jwtop exploit psychicsig ${{ steps.create-es256.outputs.jwt }} --sqa-opt-out

      - name: Exploit jwkinjection (ES256)
        run: ./jwtop exploit jwkinjection ${{ steps.create-es256.outputs.jwt }} --alg ES256 --sqa-opt-out

      - name: Exploit jkuinjection (ES256)
        run: ./jwtop exploit jkuinjection ${{ steps.create-es256.outputs.jwt }} --alg ES256 --url http://localhost:8089/jwks.json --sqa-opt-out

      - name: Exploit x5cinjection (ES256)
        run: ./jwtop exploit x5cinjection ${{ steps.create-es256.outputs.jwt }} --alg ES256 --sqa-opt-out

      - name: Exploit x5uinjection (ES256)
        run: ./jwtop exploit x5uinjection ${{ steps.create-es256.outputs.jwt }} --alg ES256 --url http://localhost:8090/cert.pem --sqa-opt-out

  run-jwt-crack-offline:
    name: JWT Crack - Offline Mode
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: jwtop

      - name: Prepare binary
        run: chmod +x jwtop

      - name: Create weak-secret token
        id: create-weak
        run: echo "jwt=$(./jwtop create --alg HS256 --secret testsecret --sqa-opt-out)" >> $GITHUB_OUTPUT

      - name: Offline crack - weak secret
        run: ./jwtop crack ${{ steps.create-weak.outputs.jwt }} --secret testsecret --sqa-opt-out

      - name: Create blank-secret token
        id: create-blank
        run: echo "jwt=$(./jwtop create --alg HS256 --secret '' --sqa-opt-out)" >> $GITHUB_OUTPUT

      - name: Offline crack - blank secret
        run: ./jwtop crack ${{ steps.create-blank.outputs.jwt }} --sqa-opt-out

  run-jwt-crack-scans:
    name: JWT Crack - ${{ matrix.challenge }}
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          - challenge: "jwt-alg-none-bypass"
          - challenge: "jwt-blank-secret"
          - challenge: "jwt-claim-oversized-value"
            crack_args: "--fuzz --secret s3cr3t-dev-key"
          - challenge: "jwt-claim-special-chars"
            crack_args: "--fuzz --secret s3cr3t-dev-key"
          - challenge: "jwt-claim-type-confusion"
            crack_args: "--fuzz --secret s3cr3t-dev-key"
          - challenge: "jwt-jku-header-injection"
          - challenge: "jwt-jwk-header-injection"
          - challenge: "jwt-kid-path-traversal"
            crack_args: "--kid-path /dev/null"
          - challenge: "jwt-kid-sql-injection"
            crack_args: "--kid-sql-table keys"
          - challenge: "jwt-not-verified"
          - challenge: "jwt-null-signature"
          - challenge: "jwt-psychic-signature"
          - challenge: "jwt-weak-hmac-secret"
          - challenge: "jwt-x5c-x5u-header-injection"

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Server
        run: docker run -d -p 8080:8080 ghcr.io/cerberauth/api-vulns-challenges/${{ matrix.challenge }}:latest

      - name: Get JWT
        id: get-jwt
        run: echo "jwt=$(docker run --rm ghcr.io/cerberauth/api-vulns-challenges/${{ matrix.challenge }}:latest jwt)" >> $GITHUB_OUTPUT

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: jwtop

      - name: Prepare binary
        run: chmod +x jwtop

      - name: jwtop crack
        id: crack
        continue-on-error: true
        run: |
          ./jwtop crack ${{ steps.get-jwt.outputs.jwt }} --url http://localhost:8080 ${{ matrix.crack_args }} --sqa-opt-out

      - name: Check for working exploit
        if: ${{ steps.crack.outputs.conclusion == 'failure' }}
        run: echo "No working exploit found for ${{ matrix.challenge }}"

      - name: Stop Server
        if: ${{ always() }}
        run: docker stop $(docker ps -q --filter ancestor=ghcr.io/cerberauth/api-vulns-challenges/${{ matrix.challenge }}:latest)

  run-jwt-crack-external-tools:
    name: JWT Crack - External Tools (john/hashcat)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Install hashcat and a CPU OpenCL runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y hashcat pocl-opencl-icd

      - name: Install john the ripper (jumbo build, via snap)
        run: |
          # The Debian/Ubuntu "john" apt package is core-only and lacks the
          # HMAC-SHA256/384/512 formats this feature relies on; jumbo (via
          # snap, which also provides the plain "john" command jwtop looks
          # for on PATH) is required. This snap installs under strict
          # confinement (home + removable-media plugs only, no /tmp access) —
          # jwtop accounts for that by keeping its john temp files under
          # $HOME. /snap/bin is on the default runner PATH.
          sudo snap install john-the-ripper

      - name: Verify tool capabilities
        run: |
          john --list=formats | grep -i hmac
          hashcat -I | grep -qi 'CPU'

      - name: Setup Go environment
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run external-tool integration tests
        run: go test -tags=integration ./jwt/exploit/external/...

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: jwtop

      - name: Prepare binary
        run: chmod +x jwtop

      - name: Create weak-secret token
        id: create-weak
        run: echo "jwt=$(./jwtop create --alg HS256 --secret testsecret --sqa-opt-out)" >> $GITHUB_OUTPUT

      - name: Offline crack via john
        run: ./jwtop crack ${{ steps.create-weak.outputs.jwt }} --john --sqa-opt-out

      - name: Offline crack via hashcat
        run: ./jwtop crack ${{ steps.create-weak.outputs.jwt }} --hashcat --sqa-opt-out

  run-jwt-hmac-confusion-scan:
    name: JWT Crack - jwt-hmac-confusion
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Server
        run: docker run -d -p 8080:8080 ghcr.io/cerberauth/api-vulns-challenges/jwt-hmac-confusion:latest

      - name: Get JWT
        id: get-jwt
        run: echo "jwt=$(docker run --rm ghcr.io/cerberauth/api-vulns-challenges/jwt-hmac-confusion:latest jwt)" >> $GITHUB_OUTPUT

      - name: Download binary
        uses: actions/download-artifact@v8
        with:
          name: jwtop

      - name: Prepare binary
        run: chmod +x jwtop

      - name: jwtop crack
        id: crack
        continue-on-error: true
        run: |
          ./jwtop crack ${{ steps.get-jwt.outputs.jwt }} --url http://localhost:8080 --key http://localhost:8080/public-key --sqa-opt-out

      - name: Check for working exploit
        if: ${{ steps.crack.outputs.conclusion == 'failure' }}
        run: echo "No working exploit found for jwt-hmac-confusion"

      - name: Stop Server
        if: ${{ always() }}
        run: docker stop $(docker ps -q --filter ancestor=ghcr.io/cerberauth/api-vulns-challenges/jwt-hmac-confusion:latest)
