# yaml-language-server: $schema=https://raw.githubusercontent.com/getargvio/argvio/main/schema/metrics/v1.schema.json
#
# jwtop's product metrics, as shown on the Argvio Product dashboard.
# Synced to Argvio on release (.github/workflows/argvio-metrics.yml); see
# https://github.com/getargvio/argvio/blob/main/docs/metric-catalog.md.
# Every dimension value is a fixed identifier chosen in code.
version: 1
service: jwtop
metrics:
  - name: jwt.algorithm
    kind: counter
    title: Algorithms used
    description: Algorithm passed to create, sign and genkey (the command is recorded with it). Algorithms outside the JWA list are "other".
    dims: [alg]
    dim_order:
      alg: [hs256, hs384, hs512, rs256, rs384, rs512, ps256, ps384, ps512, es256, es384, es512, eddsa, none, other]
  - name: find.tokens
    kind: value
    title: Tokens found per run
    description: JWTs extracted by one find run, zeros included.
  # External cracking tools, run by crack as a fallback for HMAC secrets.
  - name: crack.external-tool
    kind: counter
    title: External cracking tool runs
    description: john or hashcat runs started by crack, by outcome. notfound means the wordlist didn't contain the secret.
    dims: [tool, outcome]
    dim_order:
      outcome: [success, notfound, timeout, error]
  - name: crack.external-tool.run
    kind: duration
    title: External cracking tool run time
    description: How long john or hashcat ran, by outcome. Timeouts end at --crack-timeout.
    dims: [tool, outcome]
    dim_order:
      outcome: [success, notfound, timeout, error]
    direction: down_is_good
  - name: crack.secret-found-rate
    kind: ratio
    title: External tool success rate
    description: Share of external tool runs that found the HMAC secret.
    unit: "%"
    scale: 100
    direction: up_is_good
    numerator: { metric: crack.external-tool, where: { outcome: success } }
    denominator: { metric: crack.external-tool }
  # Scan outcome, sent by x/telemetryx/scanmetrics.
  - name: scan.checks
    kind: counter
    title: Check results
    description: Every check run in a scan, by outcome. Error means the check could not be evaluated.
    dims: [status]
    dim_order:
      status: [vulnerable, passed, skipped, error]
  - name: scan.vulnerable
    kind: counter
    title: Vulnerable checks
    description: Checks that reported at least one finding, by check and by the check's severity (from its CVSS score).
    dims: [check, severity]
    dim_order:
      severity: [critical, high, medium, low, info]
  - name: scan.findings
    kind: value
    title: Findings per scan
    description: Findings reported by one scan, by severity, zeros included, so the share of scans that find something is meaningful.
    dims: [severity]
    dim_order:
      severity: [critical, high, medium, low, info]
  - name: scan.vulnerable-rate
    kind: ratio
    title: Share of checks finding something
    description: Vulnerable check results over all check results that ran to completion or were skipped.
    unit: "%"
    scale: 100
    numerator: { metric: scan.checks, where: { status: vulnerable } }
    denominator: { metric: scan.checks }
  - name: scan.error-rate
    kind: ratio
    title: Share of checks in error
    description: Check results that could not be evaluated (network errors, unexpected responses), over all check results.
    unit: "%"
    scale: 100
    direction: down_is_good
    numerator: { metric: scan.checks, where: { status: error } }
    denominator: { metric: scan.checks }
